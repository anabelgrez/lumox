[project]
name = "lumox"
version = "2.0.0"
description = "Lumox v2 — lunar landing-site viability engine with live calculation traces"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "pint>=0.24",
    "httpx>=0.27",
    "pydantic>=2.7",
    "spiceypy>=6.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "pyshp>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lumox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
